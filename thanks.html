<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ありがとうございました</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: #fdf8f2;
      text-align: center;
      padding: 40px 20px;
      margin: 0;
      color: #5c4033;
    }

    .box {
      max-width: 420px;
      margin: auto;
      background: #fffaf3;
      padding: 30px 22px;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(92, 64, 51, 0.08);
      text-align: center;
    }

    h1 {
      font-size: 20px;
      line-height: 1.5;
      color: #5c4033;
      margin: 0 0 14px;
      text-align: center;
    }

    p {
      font-size: 14px;
      line-height: 1.8;
      color: #8c6b4f;
      margin: 0;
      text-align: center;
    }

    .btn {
      display: block;
      width: 100%;
      margin: 22px auto 0;
      padding: 14px;
      background: #d9a066;
      color: #fff;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      text-align: center;
    }

    .btn:hover {
      background: #c68c52;
    }

    .small-note {
      font-size: 12px;
      color: #a1887f;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>ご意見ありがとうございます🍞</h1>

    <p>
      いただいたご意見は、<br>
      より良いお店づくりに<br>
      活かしてまいります。
    </p>

    <p style="margin-top:15px;">
      またのご来店を、<br>
      心よりお待ちしております☺️
    </p>

    <a
      href="https://g.page/r/CZKNKglrOZN-EAE/review"
      target="_blank"
      rel="noopener noreferrer"
      class="btn"
    >
      Googleマップにも口コミを書く
    </a>

    <p class="small-note">
      ※外部サイト（Googleマップ）へ移動します
    </p>
  </div>
</body>
</html>
